<html lang="zh-TW">

        .btn { padding: 14px 24px; background: #e58282; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; font-size: 1rem; }
        .btn:hover { background: #d86c6c; }
        .btn:active { background: #c55757; }
        .btn:disabled { background: #d2c8be; cursor: not-allowed; }
        .btn-secondary { background: #e2bf81; margin-top: 10px; color: #ffffff; }
        .btn-secondary:hover { background: #d4ae6d; }
        .btn-download { background: #93b5c6; margin-top: 10px; color: #ffffff; }
        .btn-download:hover { background: #7ea3b5; }

        /* ===== 階段一：上傳頁面 (STEP 1) ===== */
        #upload-page { background: #ffffff; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); width: 100%; max-width: 520px; text-align: center; margin-top: 40px; border: 1px solid #e8e2d9; }
        .upload-area { border: 2px dashed #d2c8be; border-radius: 12px; padding: 30px 20px; cursor: pointer; background: #fdfbf7; margin: 20px 0; transition: border-color 0.2s; }
        .upload-area:hover { border-color: #e58282; }
        #preview-img { max-width: 100%; max-height: 240px; border-radius: 8px; display: none; margin: 0 auto; object-fit: contain; }

        /* ===== 階段二：獨立報告展示頁面 (STEP 2) ===== */
        #report-page { display: none; width: 100%; max-width: 780px; }
        
        /* 導出為長圖的整體包覆容器 */
        #full-report-container { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e8e2d9; margin-bottom: 16px; }

        .report-section { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px dashed #e8e2d9; }
        .report-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #f2ede4; }
        .report-header h2 { font-size: 20px; font-weight: 700; color: #222222; }
        .report-header .brand { font-size: 12px; color: #8c827a; background: #f7f4ef; padding: 4px 8px; border-radius: 4px; }

        /* 報告 Section 1 內部版面 */
        .report-body { display: grid; grid-template-columns: 220px 240px 1fr; gap: 16px; }
        
        .user-photo { 
            width: 100%; 
            height: 280px; 
            border-radius: 12px; 
            border: 1px solid #e8e2d9;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .middle-column { display: flex; flex-direction: column; gap: 12px; }
        .info-box { background: #fdfbf7; border: 1px solid #e8e2d9; border-radius: 12px; padding: 14px; text-align: center; }
        .info-box .label { font-size: 11px; font-weight: 700; color: #8c827a; letter-spacing: 0.5px; margin-bottom: 4px; }
        .season-title { font-size: 20px; font-weight: 800; color: #222222; margin-bottom: 4px; }
        .season-subtitle { font-size: 12px; color: #665e57; margin-bottom: 8px; }
        .tag-list { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
        .tag { font-size: 10px; background: #ffffff; border: 1px solid #e8e2d9; border-radius: 12px; padding: 2px 8px; color: #665e57; }

        .score-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: #665e57; margin-top: 6px; }
        .bar-container { flex: 1; height: 6px; background: #e8e2d9; border-radius: 3px; margin: 0 8px; position: relative; }
        .bar-pointer { position: absolute; top: -3px; width: 12px; height: 12px; background: #e58282; border-radius: 50%; border: 2px solid #ffffff; transition: left 0.3s ease; }

        .palette-box { background: #fdfbf7; border: 1px solid #e8e2d9; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
        .color-circle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08); margin: 0 auto; }
        .palette-desc { font-size: 11px; color: #665e57; text-align: center; margin-top: 12px; }

        .advice-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; font-size: 12px; }
        .advice-box { background: #fdfbf7; border-radius: 8px; padding: 10px; border: 1px solid #e8e2d9; }
        .advice-title { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

</head>

<!-- ================= STEP 1: 上傳照片頁面 ================= -->
<div id="upload-page">
    <div style="font-size: 12px; font-weight: 700; color: #e58282; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase;">Personal Color</div>
    <h1 style="font-size: 22px; color: #222222; margin-bottom: 8px; font-weight: 800; line-height: 1.3;">16型色彩分析 <br>調出你的專屬色盤🎨</h1>
    
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <span id="upload-txt" style="color: #665e57; font-size: 14px;">📷 點擊此處上傳<br>
        <span style="font-size: 11px; color: #8c827a;">(請上傳光線充足且無濾鏡的正面照片)</span>
        </span>
        <img id="preview-img" alt="預覽圖">
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(this.files[0])">
    
    <button class="btn" id="analyze-btn" onclick="uploadAndAnalyze()" disabled>開始分析</button>
</div>

<!-- ================= STEP 2: 獨立分析報告頁面 ================= -->
<div id="report-page">
    
    <div id="full-report-container">
        
        <!-- Part 1: 診斷與 16 色圖鑑 -->
        <div class="report-section">
            <div class="report-header">
                <h2>個人色彩分析報告 🎨</h2>
            </div>

            <div class="report-body">
                <div class="user-photo" id="card-user-img"></div>

                <div class="middle-column">
                    <div class="info-box">
                        <div class="label" sstyle="text-align: 11px; font-weight:700; color:#8c827a;"><b>Season</b></div>
                        <div class="season-title" id="card-season">-</div>
                        <div class="season-subtitle" id="card-subtitle">-</div>
                        <div class="tag-list" id="card-tags"></div>
                    </div>

                    <div class="info-box" style="text-align: left;">
                        <div class="label" style="text-align: center;"><b>PERSONAL SCORES</b></div>
                        <div class="score-row">
                            <span>WARM</span>
                            <div class="bar-container"><div class="bar-pointer" id="pointer-warm" style="left: 50%;"></div></div>
                            <span>COOL</span>
                        </div>
                        <div class="score-row">
                            <span>LOW</span>
                            <div class="bar-container"><div class="bar-pointer" id="pointer-light" style="left: 50%;"></div></div>
                            <span>HIGH</span>
                        </div>
                        <div class="score-row">
                            <span>SOFT</span>
                            <div class="bar-container"><div class="bar-pointer" id="pointer-clear" style="left: 50%;"></div></div>
                            <span>CLEAR</span>
                        </div>
                    </div>
                </div>

                <div class="palette-box">
                    <div class="label" style="text-align: 11px; font-weight:700; color:#8c827a;"><b>Your color 🎨</b></div>
                    <div class="palette-grid" id="card-palette"></div>
                    <div class="palette-desc" id="card-palette-desc">-</div>
                </div>
            </div>

            <div class="advice-section">
                <div class="advice-box">
                    <div class="advice-title" style="color: #d86c6c;"><b>適合你的❤️</b></div>
                    <div id="card-good-text" style="color: #444444;">-</div>
                </div>
                <div class="advice-box">
                    <div class="advice-title" style="color: #8c827a;"><b>避雷指南🧭</b></div>
                    <div id="card-bad-text" style="color: #444444;">-</div>
                </div>
            </div>
        </div>

        <!-- Part 2: 彩妝、髮色與穿搭指南 -->

            <div class="report-header">
                <h2>彩妝、髮色與穿搭指南 ✨</h2>
            </div>

                <div class="guide-card">

                    <div class="guide-text" id="card-makeup-text">-</div>
                </div>

                <div class="guide-card">
                    <div class="guide-title" style="color: #e2bf81;"><b>💇‍♀️ 推薦髮色與飾品</b></div>
                    <div class="guide-text" id="card-hair-text">-</div>
                </div>

                <div class="guide-card">
                    <div class="guide-title" style="color: #93b5c6;"><b>👗 穿搭與材質指南 </b></div>
                    <div class="guide-text" id="card-outfit-text">-</div>
                </div>
            </div>
        </div>

    </div>

    <div class="actions-wrapper">
        <button class="btn btn-download" onclick="downloadReportImage()">下載分析結果 📥</button>
        <button class="btn btn-secondary" onclick="resetToUpload()">重新檢測 🔄</button>
    </div>
</div>

    function handleFileSelect(file) {
        if (!file) return;
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('preview-img').style.display = 'block';
            
            document.getElementById('card-user-img').style.backgroundImage = `url('${e.target.result}')`;
            
            document.getElementById('upload-txt').style.display = 'none';
            document.getElementById('analyze-btn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    async function uploadAndAnalyze() {
        if (!selectedFile) return;

        const btn = document.getElementById('analyze-btn');
        btn.innerText = 'AI 色彩分析進行中...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('image', selectedFile);

        try {
            const response = await fetch('/api/analyze', { method: 'POST', body: formData });
            const data = await response.json();

            if (response.ok) {
                renderReport(data);
                document.getElementById('upload-page').style.display = 'none';
                document.getElementById('report-page').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert('分析失敗：' + (data.error || '請確認照片後重試'));
            }
        } catch (err) {
            alert('系統連線失敗，請稍後重試');
        } finally {
            btn.innerText = '開始診斷';
            btn.disabled = false;
        }
    }

    function renderReport(data) {
        const seasonKey = data.season;
        const config = colorDatabase[seasonKey] || colorDatabase["亮冬 (Bright Winter)"];

        document.getElementById('card-season').innerText = seasonKey;
        document.getElementById('card-subtitle').innerText = config.subtitle;
        document.getElementById('card-tags').innerHTML = config.tags.map(t => `<span class="tag">${t}</span>`).join('');

        // 依據後端指標位移 Indicator
        document.getElementById('pointer-warm').style.left = data.is_warm ? '20%' : '80%';
        document.getElementById('pointer-light').style.left = data.is_light ? '80%' : '20%';
        document.getElementById('pointer-clear').style.left = data.is_clear ? '80%' : '20%';

        document.getElementById('card-palette').innerHTML = config.palette.map(hex => `<div class="color-circle" style="background-color: ${hex};"></div>`).join('');
        document.getElementById('card-palette-desc').innerText = config.paletteDesc;

        document.getElementById('card-good-text').innerText = config.good;
        document.getElementById('card-bad-text').innerText = config.bad;

        document.getElementById('card-makeup-text').innerText = config.makeup;
        document.getElementById('card-hair-text').innerText = config.hair;
        document.getElementById('card-outfit-text').innerText = config.outfit;
    }

    function resetToUpload() {
        document.getElementById('report-page').style.display = 'none';
        document.getElementById('upload-page').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        selectedFile = null;
        const fileInput = document.getElementById('file-input');
        if (fileInput) fileInput.value = '';

        const previewImg = document.getElementById('preview-img');
        if (previewImg) {
            previewImg.src = '';
            previewImg.style.display = 'none';
        }

        const cardUserImg = document.getElementById('card-user-img');
        if (cardUserImg) {
            cardUserImg.style.backgroundImage = 'none';
        }

        const uploadTxt = document.getElementById('upload-txt');
        if (uploadTxt) {
            uploadTxt.style.display = 'block';
        }

        const analyzeBtn = document.getElementById('analyze-btn');
        if (analyzeBtn) {
            analyzeBtn.disabled = true;
        }
    }

    async function downloadReportImage() {
        const reportContainer = document.getElementById('full-report-container');
        
        const canvas = await html2canvas(reportContainer, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false
        });

        const image = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = image;
        link.download = `Personal_Color_Report_${Date.now()}.png`;
        link.click();
    }
